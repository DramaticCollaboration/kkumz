<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="af-primary-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="af-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="af-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Soft Rounded Shape -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#af-primary-grad)" filter="url(#af-glow)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="9.5" y="9.5" width="101" height="101" rx="26.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Shopping Handle / Upper Arch of 'A' -->
  <path d="M 44 42 C 44 32, 76 32, 76 42" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" fill="none"/>

  <!-- Modern Geometric 'A' Body & Bag Silhouette -->
  <!-- Left Leg -->
  <path d="M 33 82 L 56 38 C 57.5 35, 62.5 35, 64 38 L 87 82" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Infinity Loop & Profit Crossbar (Sleek Flow) -->
  <path d="M 41 65 C 48 57, 72 57, 79 65 C 84 71, 74 77, 60 71 C 46 65, 36 71, 41 77 C 46 83, 74 83, 79 77" 
        stroke="url(#af-accent-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Center AI Core Spark -->
  <circle cx="60" cy="54" r="3.5" fill="#FFFFFF"/>
</svg>
