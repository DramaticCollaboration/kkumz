<!DOCTYPE html>
<html lang="ko_KR" id="htmlRoot">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />

    <title><%= title %></title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- 도로명 우편번호 서비스 및 인터랙티브 지도 리소스 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" defer></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <!-- 글로벌 구성 -->
    <script>
      window._CONFIG = {};
    </script>
  </head>
  <body>
    <script>
      (() => {
        var htmlRoot = document.getElementById('htmlRoot');
        var theme = window.localStorage.getItem('__APP__DARK__MODE__') || 'light';
        if (htmlRoot) {
          htmlRoot.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            htmlRoot.classList.add('dark');
          } else {
            htmlRoot.classList.remove('dark');
          }
          theme = htmlRoot = null;
        }
      })();
    </script>
    <div id="app">
      <style>
        html,
        body {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }

        .app-loading {
          position: fixed;
          top: 0;
          left: 0;
          display: flex;
          width: 100vw;
          height: 100vh;
          min-height: 100dvh;
          justify-content: center;
          align-items: center;
          background: radial-gradient(circle at 50% 50%, #ffffff 0%, #f1f5f9 100%);
          font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          z-index: 99999;
          transition: opacity 0.3s ease;
        }

        html[data-theme='dark'] .app-loading {
          background: radial-gradient(circle at 50% 50%, #111a2e 0%, #080c14 100%);
        }

        .app-loading-wrap {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          user-select: none;
        }

        .app-loading-logo-box {
          position: relative;
          width: 88px;
          height: 88px;
          margin-bottom: 22px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .app-loading-logo {
          width: 72px;
          height: 72px;
          border-radius: 20px;
          box-shadow: 0 12px 28px -5px rgba(37, 99, 235, 0.3), 0 8px 10px -6px rgba(37, 99, 235, 0.2);
          position: relative;
          z-index: 2;
          object-fit: contain;
          animation: afFloat 2.8s ease-in-out infinite;
        }

        .app-loading-ring {
          position: absolute;
          inset: -4px;
          border-radius: 26px;
          border: 2px solid #2563eb;
          opacity: 0.75;
          animation: ringPulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .app-loading-title {
          font-size: 26px;
          font-weight: 800;
          letter-spacing: -0.03em;
          color: #0f172a;
          margin-bottom: 8px;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .app-loading-title span.accent {
          color: #2563eb;
        }

        .app-loading-badge {
          font-size: 11px;
          font-weight: 700;
          background: linear-gradient(135deg, #2563eb 0%, #10b981 100%);
          color: #ffffff;
          padding: 2px 8px;
          border-radius: 6px;
          letter-spacing: 0.05em;
        }

        html[data-theme='dark'] .app-loading-title {
          color: #f8fafc;
        }

        html[data-theme='dark'] .app-loading-title span.accent {
          color: #3b82f6;
        }

        .app-loading-subtitle {
          font-size: 14px;
          font-weight: 500;
          color: #64748b;
          height: 20px;
          margin-bottom: 24px;
          transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .app-loading-subtitle.fade-out {
          opacity: 0;
          transform: translateY(2px);
        }

        html[data-theme='dark'] .app-loading-subtitle {
          color: #94a3b8;
        }

        .app-progress-wrap {
          position: relative;
          width: 220px;
          height: 4px;
          border-radius: 99px;
          background: rgba(37, 99, 235, 0.14);
          overflow: hidden;
        }

        html[data-theme='dark'] .app-progress-wrap {
          background: rgba(255, 255, 255, 0.1);
        }

        .app-progress-bar {
          position: absolute;
          top: 0;
          left: 0;
          width: 45%;
          height: 100%;
          border-radius: 99px;
          background: linear-gradient(90deg, #2563eb 0%, #10b981 100%);
          animation: afProgressSlide 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes afFloat {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }

        @keyframes ringPulse {
          0%, 100% { transform: scale(0.95); opacity: 0.75; }
          50% { transform: scale(1.1); opacity: 0.2; }
        }

        @keyframes afProgressSlide {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
      </style>
      <div class="app-loading">
        <div class="app-loading-wrap">
          <div class="app-loading-logo-box">
            <div class="app-loading-ring"></div>
            <img src="/logo.png" class="app-loading-logo" alt="Kkumz" />
          </div>
          <div class="app-loading-title">
            <span>꿈즈 </span><span class="accent">Kkumz</span>
            <span class="app-loading-badge">ADMIN CONSOLE</span>
          </div>
          <div class="app-loading-subtitle" id="appLoadingStatus">꿈즈 AI 브랜드·멀티사이트 빌더 관제 콘솔을 준비하고 있습니다...</div>
          <div class="app-progress-wrap">
            <div class="app-progress-bar"></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const statusEl = document.getElementById('appLoadingStatus');
          if (!statusEl) return;
          const statusList = [
            '꿈즈 AI 브랜드·멀티사이트 빌더 관제 콘솔을 준비하고 있습니다...',
            'AI 스튜디오 프롬프트 및 멀티사이트 배포 파이프라인 연결 중...',
            '커뮤니티 팀빌딩 및 모더레이션 큐 동기화 중...',
            '꿈즈 Kkumz 관제 콘솔 준비 완료'
          ];
          let idx = 0;
          const interval = setInterval(() => {
            if (!document.getElementById('appLoadingStatus')) {
              clearInterval(interval);
              return;
            }
            idx = (idx + 1) % statusList.length;
            statusEl.classList.add('fade-out');
            setTimeout(() => {
              statusEl.textContent = statusList[idx];
              statusEl.classList.remove('fade-out');
            }, 300);
          }, 1800);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
