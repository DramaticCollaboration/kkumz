server:
  port: ${SERVER_PORT:9580}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kkumz_db?currentSchema=public&stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:syncadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:syncpass}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:syncpass}

kkumz:
  cross-db:
    shop-url: ${KKUMZ_SHOP_DB_URL:jdbc:postgresql://localhost:5432/syncshop_db?currentSchema=public&stringtype=unspecified}
    cms-url: ${KKUMZ_CMS_DB_URL:jdbc:postgresql://localhost:5432/synccms_db?currentSchema=public&stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:syncadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:syncpass}
  nacos:
    enabled: false
