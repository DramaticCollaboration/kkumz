server:
  port: ${SERVER_PORT:9580}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kkumz}?currentSchema=public&stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:syncadmin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:syncpass}}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

kkumz:
  integration:
    cms-base-url: ${KKUMZ_CMS_BASE_URL:http://localhost:18085}
    cms-access-key: ${KKUMZ_CMS_ACCESS_KEY:ak_cms_kkumz_live_01}
    cms-secret-key: ${KKUMZ_CMS_SECRET_KEY:sk_cms_kkumz_secret_2026_prod_99}
    shop-base-url: ${KKUMZ_SHOP_BASE_URL:http://localhost:8501}
    shop-access-key: ${KKUMZ_SHOP_ACCESS_KEY:ak_shop_kkumz_live_01}
    shop-secret-key: ${KKUMZ_SHOP_SECRET_KEY:sk_shop_kkumz_secret_2026_prod_88}
  cross-db:
    shop-url: ${KKUMZ_SHOP_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/sync_shop?currentSchema=public&stringtype=unspecified}
    cms-url: ${KKUMZ_CMS_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/sync_cms?currentSchema=public&stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:syncadmin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:syncpass}}
  ai:
    llm:
      base-url: ${SYNC_LLM_GATEWAY_URL:http://localhost:8080/v1}
      api-key: ${SYNC_LLM_API_KEY:sk-kkumz-local-key-1010}
      model: ${SYNC_LLM_MODEL:morph-glm53flash}
  storage:
    upload-dir: ${KKUMZ_STORAGE_UPLOAD_DIR:uploads/kkumz}
    public-prefix: ${KKUMZ_STORAGE_PUBLIC_PREFIX:/api/v1/kkumz/assets/files}
  nacos:
    enabled: false

agentscope:
  agent:
    id: ${SYNC_AGENT_ID:KKUMZ_STUDIO}
    name: ${SYNC_AGENT_NAME:Kkumz AI Studio Agent}
  llm:
    provider: ${LLM_PROVIDER:syncllm}
    gateway-url: ${SYNC_LLM_GATEWAY_URL:http://localhost:8080/v1}
    api-key: ${SYNC_LLM_API_KEY:sk-kkumz-local-key-1010}
    model-name: ${SYNC_LLM_MODEL:morph-glm53flash}
    timeout-seconds: 90
    max-retries: 3
