server:
  port: ${SERVER_PORT:9580}
  servlet:
    context-path: /

spring:
  application:
    name: kkumz-server-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
