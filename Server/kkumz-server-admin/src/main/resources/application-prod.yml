server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}

kkumz:
  integration:
    cms-base-url: ${KKUMZ_CMS_BASE_URL}
    cms-access-key: ${KKUMZ_CMS_ACCESS_KEY}
    cms-secret-key: ${KKUMZ_CMS_SECRET_KEY}
    shop-base-url: ${KKUMZ_SHOP_BASE_URL}
    shop-access-key: ${KKUMZ_SHOP_ACCESS_KEY}
    shop-secret-key: ${KKUMZ_SHOP_SECRET_KEY}
  cross-db:
    shop-url: ${KKUMZ_SHOP_DB_URL}
    cms-url: ${KKUMZ_CMS_DB_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  ai:
    llm:
      base-url: ${SYNC_LLM_GATEWAY_URL}
      api-key: ${SYNC_LLM_API_KEY}
      model: ${SYNC_LLM_MODEL}
  storage:
    upload-dir: ${KKUMZ_STORAGE_UPLOAD_DIR}
    public-prefix: ${KKUMZ_STORAGE_PUBLIC_PREFIX:/api/v1/kkumz/assets/files}
  nacos:
    enabled: true
