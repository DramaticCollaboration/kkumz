services:
  # PostgreSQL 18.6 Database Service (pgvector + 6-Stage DB Init)
  kkumz-postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: kkumz-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-kkumz}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/:/docker-entrypoint-initdb.d/
    networks:
      - kkumz-local-net

  # Redis 7 In-Memory Cache & Session Storage
  kkumz-redis:
    image: redis:7-alpine
    container_name: kkumz-redis
    hostname: kkumz-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - kkumz-local-net

networks:
  kkumz-local-net:
    name: kkumz-local-net
    driver: bridge

volumes:
  redis_data:
  postgres_data:
